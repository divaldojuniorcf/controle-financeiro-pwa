# Servidor de lembretes no Cloudflare Workers (plano gratuito).
name = "controle-financeiro-lembretes"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Confere os avisos a cada 5 minutos.
[triggers]
crons = ["*/5 * * * *"]

# Guarda só a assinatura de push e os horários de cada aparelho.
# O id é preenchido depois de `npx wrangler kv namespace create DISPOSITIVOS`.
[[kv_namespaces]]
binding = "DISPOSITIVOS"
id = "3b6d6061212f43b7b48e0fcd778ee1e3"

[vars]
VAPID_PUBLICA = "BOoyqn8aeQW7osCiKY5xthemflS0-cvkfYuxjIlWv7hMiBxAvYe9S-v9tXj5MdEK5skrIGyQbv6iezmm5M6bj-k"
ASSUNTO = "https://divaldojuniorcf.github.io/controle-financeiro-pwa/"
ORIGENS = "https://divaldojuniorcf.github.io,http://localhost:5173,https://localhost:5173,https://192.168.3.20:5173"

# Segredo (não fica aqui): VAPID_PRIVADA, enviado com `npx wrangler secret bulk .segredos.json`.
